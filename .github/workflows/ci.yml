# Root CI — $0 forever: ubuntu-latest on the GitHub free tier only.
# Two jobs, one per subtree, matching each suite's own historical CI.
name: ci

on: [push, pull_request]

jobs:
  fantasyhub:
    name: apps/fantasyhub pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/fantasyhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        # requirements-ml.txt for train_model/backtest tests (numpy+xgboost),
        # requirements-dev.txt for pytest itself.
        run: pip install -r requirements.txt -r requirements-ml.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest api/ scripts/ -q --tb=short

  research:
    name: research pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # -e . : src/ffanalytics/__init__ reads its own version via
      # importlib.metadata, which needs the package installed, not just
      # pythonpath'd.
      - run: python -m venv .venv && .venv/bin/pip install -e . -r requirements.txt
      - name: Run tests
        run: SLEEPER_LEAGUE_ID=test .venv/bin/pytest -q
        env:
          SLEEPER_LEAGUE_ID: test
